name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check src tests examples

    - name: Format check with black
      run: |
        black --check src tests examples

    - name: Type check with mypy
      run: |
        mypy src

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

    - name: Run examples
      run: |
        python examples/basic_usage.py
        python examples/advanced_features.py
        python examples/teaching.py
        python examples/lesson_exercises.py --answers

    - name: Build and verify installed wheel
      run: |
        python -m build
        python -m venv /tmp/fsa-wheel
        /tmp/fsa-wheel/bin/pip install dist/*.whl
        cd /tmp
        /tmp/fsa-wheel/bin/python -c "from python_fsa import StateMachine; assert StateMachine.div_by(2, 3).accepts([1, 1])"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
